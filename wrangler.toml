name = "sellora-ai-api"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
GROQ_BASE_URL = "https://api.groq.com/openai/v1"
GROQ_MODEL = "qwen/qwen3.8-27b"
GOOGLE_STUDIO_BASE_URL = "https://generativelanguage.googleapis.com/v1beta"
GOOGLE_STUDIO_MODEL = "gemma-4-31b-it"
DEAPI_BASE_URL = "https://api.deapi.ai/v1"
DEAPI_MODEL = "flux-2-klein-4b"
WINDPAINT_BASE_URL = "https://api.windpaint.ai/v1"
WINDPAINT_MODEL = "flux-2-klein-4b"
WORKERS_AI_IMAGE_MODEL = "@cf/black-forest-labs/flux-2-klein-4b"

[ai]
binding = "AI"
